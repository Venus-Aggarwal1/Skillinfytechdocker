apiVersion: v1
kind: Service
metadata:
  name: venus-app1-service
spec:
  type: NodePort
  selector:
    app: venus-app1
  ports:
    - port: 80         # Port exposed inside the cluster
      targetPort: 8080 # Port your container is running on
      nodePort: 30010  # Accessible port on your local machine (range 30000-32767)

